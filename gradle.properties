# --- Gradle 构建参数 ---
# 内存上限：JVM 堆 1536m / 元空间 512m
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m
org.gradle.daemon=false
org.gradle.workers.max=2
org.gradle.parallel=false

# --- Android / Kotlin ---
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# --- 代理设置（当前环境直连可用，代理 127.0.0.1:18080 已停用，如需启用请取消注释）---
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=18080
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=18080
# systemProp.http.nonProxyHosts=localhost|127.0.0.1
