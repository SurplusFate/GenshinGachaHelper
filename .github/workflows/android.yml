name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 发布 Release 需要写权限；其余步骤只读内容
permissions:
  contents: write

# 同一分支的重复推送取消排队中的旧任务，避免并发抢占
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # 所有 action 按 commit SHA 固定，避免上游 tag 被移动导致构建被投毒
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 优先用仓库 Secrets 里的固定签名密钥（KEYSTORE_BASE64 / 口令 / 别名），
      # 保证每个 release 签名一致、老用户能直接覆盖升级；
      # Secrets 缺失时才现场生成一次性密钥（仅够签名校验通过，不可用于发布升级）。
      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "使用 Secrets 中的固定签名密钥"
            echo "KEYSTORE_STORE_PASSWORD=$KEYSTORE_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEYSTORE_KEY_PASSWORD=$KEYSTORE_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "KEYSTORE_KEY_ALIAS=$KEYSTORE_KEY_ALIAS" >> "$GITHUB_ENV"
          else
            echo "::warning::未配置 KEYSTORE_BASE64，现场生成一次性密钥（产物无法覆盖升级）"
            PASS="$(openssl rand -hex 16)"
            echo "KEYSTORE_STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "KEYSTORE_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "KEYSTORE_KEY_ALIAS=gacha-release" >> "$GITHUB_ENV"
            keytool -genkeypair -v -keystore release.keystore -alias gacha-release \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=CI, OU=CI, O=CI, L=CI, ST=CI, C=CN"
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # lint 纳入 CI：静态检查不过即失败，防止问题回归
      - name: Run lint
        run: ./gradlew lintDebug --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      # release 走 R8 混淆 + 资源压缩，必须与 debug 一同验证，避免 release 专属规则失效
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      # push 到 main 且全过程通过 → 以 versionName 建 tag + Release，附 release APK
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)"
          if [ -z "$VERSION" ]; then echo "读不到 versionName"; exit 1; fi
          TAG="v${VERSION}"
          echo "version=$VERSION tag=$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，跳过"
            exit 0
          fi
          # 沿用历史命名习惯：GenshinGachaHelper-v1.9.33.apk
          cp app/build/outputs/apk/release/app-release.apk "GenshinGachaHelper-v${VERSION}.apk"
          gh release create "$TAG" \
            "GenshinGachaHelper-v${VERSION}.apk" \
            --title "v${VERSION}" \
            --generate-notes